<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar · Simulador Bancario</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="brand" style="margin-bottom: 1.25rem;">
        <div class="brand-mark">SB</div>
        <span>Simulador Bancario</span>
      </div>
      <h1>Ingresar</h1>
      <p class="muted" style="margin-top: 0; margin-bottom: 1.25rem;">
        Accede a tu banca virtual o panel de administración.
      </p>

      <div id="alert" class="alert alert-error" hidden></div>

      <form id="loginForm">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" autocomplete="username" required
               placeholder="ana@banco.test" />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               placeholder="••••••••" />

        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>



      <p style="margin-top: 1rem; font-size: 0.88rem;">
        <a href="/cajero/">Ir al cajero automático →</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (async function () {
      try {
        const data = await API.me();
        if (data.user?.rol === 'ADMIN') location.href = '/admin/';
        else if (data.user?.rol === 'CLIENTE') location.href = '/cliente/';
      } catch (_) { /* no session */ }
    })();

    const form = document.getElementById('loginForm');
    const alertEl = document.getElementById('alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert(alertEl);
      const email = form.email.value.trim();
      const password = form.password.value;
      try {
        const data = await API.login(email, password);
        if (data.user.rol === 'ADMIN') location.href = '/admin/';
        else location.href = '/cliente/';
      } catch (err) {
        showAlert(alertEl, err.message || 'No se pudo iniciar sesión');
      }
    });
  </script>
</body>
</html>
